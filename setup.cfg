[metadata]
name = sovereigninterpreter
version = 0.3.0
author = SovereignInterpreter
description = SovereignInterpreter: a local-first, offline-capable code execution interpreter (independent fork of an upstream interpreter framework / original reference implementation).
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
keywords =
    interpreter
    local-llm
    code-execution
    sovereign
    offline
    local-first

[options]
packages = find:
zip_safe = True
include_package_data = True
install_requires =
    pydantic>=2.0
python_requires = >=3.10

[options.extras_require]
dev =
    pytest>=7.0

[options.entry_points]
console_scripts =
    sovereigninterpreter = sovereigninterpreter.cli:main

[options.packages.find]
exclude =
    tests*
    examples*
    _ref*
